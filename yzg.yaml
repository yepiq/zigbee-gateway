substitutions:
  # Device identity
  name: yzg
  friendly_name: Yepiq Zigbee Gateway

  # External component source
  zigbee_gateway_source: components
  zigbee_gateway_refresh: 0s

  # ESP32 host hardware
  esp32_minimum_chip_revision: '3.1'
  esp32_sram1_as_iram: 'true'

  # TCP serial server
  tcp_serial_port: 6638
  tcp_pending_socket_timeout_ms: 30000
  tcp_parked_socket_timeout_ms: 600000

  # Zigbee firmware catalog and staging
  firmware_catalog_url: https://raw.githubusercontent.com/xyzroe/XZG/zb_fws/ti/manifest.json
  firmware_catalog_chip: CC2652P7
  firmware_catalog_preferred_role: coordinator
  firmware_catalog_startup_timeout: 20s
  firmware_catalog_http_timeout: 15s
  firmware_catalog_max_manifest_size: 64kB
  firmware_catalog_refresh_hour: '4'
  firmware_catalog_refresh_minute: '0'
  firmware_catalog_refresh_days: MON-SUN

  # Physical mode button and USB Direct selector
  button_pin: GPIO35
  button_inverted: true
  button_strapping: false
  mode_pin: GPIO33
  mode_strapping: false

  # TI Zigbee radio control
  zRST_pin: GPIO16
  zRST_strapping: false
  zRST_inverted: true
  zBSL_pin: GPIO32
  zBSL_strapping: false
  zBSL_inverted: true

  # Front-panel indicators
  led_red_pin: GPIO12
  led_red_strapping: true
  led_red_inverted: false
  led_blue_pin: GPIO14
  led_blue_strapping: false
  led_blue_inverted: false

  # Radio-facing and USB-facing serial ports
  uart_rx_pin: GPIO36
  uart_tx_pin: GPIO04
  uart_baud_rate: 115200
  uart_rx_buffer_size: 2048
  usb_uart_rx_pin: GPIO03
  usb_uart_tx_pin: GPIO01

  # Ethernet PHY
  lan_mdc_pin: GPIO23
  lan_mdc_strapping: false
  lan_mdio_pin: GPIO18
  lan_mdio_strapping: false
  lan_clk_pin: GPIO17
  lan_clk_strapping: false
  lan_clk_mode: CLK_OUT
  lan_power_pin: GPIO05
  lan_power_strapping: true

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: yepiq.Zigbee_Gateway
    version: '2.04b'

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: ${esp32_minimum_chip_revision}
      sram1_as_iram: ${esp32_sram1_as_iram}
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: '10'

# External component
external_components:
  - source: ${zigbee_gateway_source}
    refresh: ${zigbee_gateway_refresh}
    components: [zigbee_gateway]

# Logging
logger:
  level: DEBUG
  # Do not enable serial logging: UART0 is the USB Bridged data endpoint.
  # Logger output would be injected into, and corrupt, the Zigbee serial stream.
  baud_rate: 0

# Ethernet
ethernet:
  type: LAN8720
  mdc_pin:
    number: ${lan_mdc_pin}
    ignore_strapping_warning: ${lan_mdc_strapping}
  mdio_pin:
    number: ${lan_mdio_pin}
    ignore_strapping_warning: ${lan_mdio_strapping}
  clk:
    pin:
      number: ${lan_clk_pin}
      ignore_strapping_warning: ${lan_clk_strapping}
    mode: ${lan_clk_mode}
  phy_addr: 0
  power_pin:
    number: ${lan_power_pin}
    ignore_strapping_warning: ${lan_power_strapping}

# Management interfaces
api:
  # This Ethernet gateway must remain operational without an API client.
  reboot_timeout: 0s

ota:
  platform: esphome

web_server:
  version: 3
  id: websrv

dashboard_import:
  package_import_url: github://yepiq/zigbee-gateway/yzg-package.yaml@main
  import_full_config: false

# Network discovery
mdns:
  services:
    - service: '_uzg-01'
      protocol: '_tcp'
      port: ${tcp_serial_port}
      txt:
        version: 1.0
        name: UZG-01
        radio_type: znp
        baud_rate: ${uart_baud_rate}
        data_flow_control: software

# Home Assistant time
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      # Check the upstream catalog on the configured local schedule.
      - seconds: 0
        minutes: ${firmware_catalog_refresh_minute}
        hours: ${firmware_catalog_refresh_hour}
        days_of_week: ${firmware_catalog_refresh_days}
        then:
          - lambda: id(zigbee_firmware_manager).request_refresh(false);

# Serial interfaces
uart:
  # Define the USB-facing port first so it receives ESP32 UART0 after the
  # serial logger has released that controller with baud_rate: 0.
  - id: usb_uart_bus
    rx_pin: ${usb_uart_rx_pin}
    tx_pin: ${usb_uart_tx_pin}
    baud_rate: ${uart_baud_rate}
    rx_buffer_size: ${uart_rx_buffer_size}

  - id: uart_bus
    rx_pin: ${uart_rx_pin}
    tx_pin: ${uart_tx_pin}
    baud_rate: ${uart_baud_rate}
    rx_buffer_size: ${uart_rx_buffer_size}

# Zigbee gateway
zigbee_gateway:
  id: zigbee_gateway_component

  # Serial paths and TCP server policy
  uart_id: uart_bus
  usb_uart_id: usb_uart_bus
  ip_address: mcu_ip_address
  tcp_port: ${tcp_serial_port}
  pending_socket_timeout: ${tcp_pending_socket_timeout_ms}ms
  parked_socket_timeout: ${tcp_parked_socket_timeout_ms}ms

  # Radio control and transport hardware
  reset_pin:
    number: ${zRST_pin}
    inverted: ${zRST_inverted}
    ignore_strapping_warning: ${zRST_strapping}
  bsl_pin:
    number: ${zBSL_pin}
    inverted: ${zBSL_inverted}
    ignore_strapping_warning: ${zBSL_strapping}
  mode_pin:
    number: ${mode_pin}
    ignore_strapping_warning: ${mode_strapping}
  mode_led_pin:
    number: ${led_red_pin}
    inverted: ${led_red_inverted}
    ignore_strapping_warning: ${led_red_strapping}

  # Firmware catalog, persistent target, and radio update
  firmware_update:
    id: zigbee_firmware_manager
    manifest_url: ${firmware_catalog_url}
    chip: ${firmware_catalog_chip}
    preferred_role: ${firmware_catalog_preferred_role}
    startup_timeout: ${firmware_catalog_startup_timeout}
    http_timeout: ${firmware_catalog_http_timeout}
    max_manifest_size: ${firmware_catalog_max_manifest_size}

    # Chooses the Zigbee role to install.
    target_firmware_role:
      name: Target Firmware Role

    # Chooses a compatible build for the selected role.
    target_firmware_version:
      name: Target Firmware Version

    # Checks the upstream catalog immediately.
    refresh_firmware_catalog:
      name: Refresh Firmware Catalog

    # Downloads, verifies, and installs the selected Zigbee firmware.
    install_firmware:
      name: Install Zigbee Firmware

    # Discards the downloaded image so the next update downloads it again.
    invalidate_staged_firmware:
      name: Clear Staged Zigbee Firmware

    # Availability of the cached or downloaded firmware catalog.
    firmware_catalog_status:
      name: Firmware Catalog Status

    # Current stage or final result of the firmware update.
    firmware_update_status:
      name: Firmware Update Status

    # Combined download, staging, and radio-operation progress.
    firmware_update_progress:
      name: Firmware Update Progress

    # Indicates that the most recent catalog check failed.
    firmware_catalog_check_failed:
      name: Firmware Catalog Check Failed

  # User controls

  # Chooses TCP, an ESP32-managed USB bridge, or the direct USB hardware path.
  serial_transport:
    name: Zigbee Serial Transport
    id: select_mode

  # Restarts the TI radio without restarting the ESP32.
  restart:
    name: Restart Zigbee

  # Prepares the TI radio bootloader for a firmware update.
  enter_bsl:
    name: Zigbee BSL Mode

  # Clears a compatible router's network association and starts pairing again.
  router_factory_reset:
    name: Factory Reset Zigbee Router

  # Identifies the radio while TCP is idle and refreshes its cached information.
  refresh_metadata:
    name: Refresh Zigbee Information

  # Radio identity

  # Detected TI radio family and variant.
  hardware:
    name: Zigbee Hardware

  # Detected flash capacity of the TI radio.
  flash_size:
    name: Zigbee Flash Size

  # ZNP firmware version observed from the running image.
  firmware:
    name: Zigbee Firmware

  # Z-Stack version observed from the running image.
  stack:
    name: Zigbee Stack

  # Permanent IEEE address programmed at the factory.
  factory_ieee:
    name: Zigbee Factory IEEE Address

  # IEEE address currently used by the running Zigbee firmware.
  self_ieee:
    name: Zigbee Active IEEE Address

  # Current radio role reported or recovered from the TI radio.
  role:
    name: Zigbee Role

  # Zigbee network information

  # Last transmit-power setting observed in ordinary ZNP traffic.
  tx_power:
    name: Zigbee TX Power

  # Last observed Zigbee network identifier.
  pan_id:
    name: Zigbee PAN ID

  # Last observed Zigbee radio channel.
  channel:
    name: Zigbee Channel

  # Whether the radio was last observed as joined to a Zigbee network.
  on_network:
    name: Zigbee Network Status

  # IEEE address of the router's parent or the network coordinator.
  parent_ieee:
    name: Zigbee Parent IEEE Address

  # Last observed extended identifier of the Zigbee network.
  extended_pan_id:
    name: Zigbee Extended PAN ID

  # Information provenance

  # Explains whether radio identity is verified, observed, cached, or unavailable.
  metadata_status:
    name: Zigbee Metadata Status

  # Explains whether the network snapshot is observed, cached, or unavailable.
  network_information_status:
    name: Zigbee Network Information Status

  # TCP diagnostics

  # True while any active, pending, or parked TCP socket is retained.
  socket_connected:
    name: Socket Status
    id: socket_status

  # Number of active, pending, and parked TCP sockets currently retained.
  connection_count:
    name: Socket Connections
    id: socket_connections

  # Current TCP state: idle, provisional, normal, or maintenance.
  transport_state:
    name: Zigbee TCP State

  # A second TCP client is waiting to request a maintenance takeover.
  pending_socket:
    name: Zigbee TCP Pending Socket

  # The normal TCP client is quarantined while maintenance owns the radio.
  parked_socket:
    name: Zigbee TCP Parked Socket

  # Most recent transition made by the TCP ownership state machine.
  last_transport_event:
    name: Zigbee TCP Last Event

  # TCP connections rejected since the ESP32 started.
  rejected_connections:
    name: Zigbee TCP Rejected Connections

  # Pending maintenance candidates that expired before takeover.
  pending_timeouts:
    name: Zigbee TCP Pending Timeouts

  # Firmware-maintenance sessions started since the ESP32 booted.
  maintenance_sessions:
    name: Zigbee TCP Maintenance Sessions

  # Radio recovery resets performed after interrupted maintenance.
  recovery_resets:
    name: Zigbee TCP Recovery Resets

# Local controls and indicators
button:
  # Restarts the ESP32 and all gateway services.
  - platform: restart
    name: Restart ESP32
    id: restart_esp32
    entity_category: config

binary_sensor:
  # Cycles the Zigbee serial transport when the front-panel button is pressed.
  - platform: gpio
    name: Mode Button
    id: mode_button
    pin:
      number: ${button_pin}
      mode: INPUT
      inverted: ${button_inverted}
      ignore_strapping_warning: ${button_strapping}
    entity_category: diagnostic
    on_press:
      then:
        - select.next: select_mode

switch:
  # Keeps the blue front-panel power indicator illuminated.
  - platform: gpio
    name: Power LED (BLUE)
    id: led_blue
    internal: true
    pin:
      number: ${led_blue_pin}
      ignore_strapping_warning: ${led_blue_strapping}
      inverted: ${led_blue_inverted}
    restore_mode: ALWAYS_ON

# Standard diagnostics
sensor:
  - platform: uptime
    type: timestamp
    name: Uptime
    id: mcu_uptime
    time_id: ha_time
    device_class: uptime
    entity_category: diagnostic

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: IP Address
      id: mcu_ip_address
      entity_category: diagnostic
      icon: mdi:ip-network
    mac_address:
      name: MAC Address
      id: mcu_mac_address
      entity_category: diagnostic
      disabled_by_default: true
      icon: mdi:lan
