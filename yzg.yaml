substitutions:
  name: yzg
  friendly_name: Yepiq Zigbee Gateway

  tcp_serial_port: 6638
  tcp_pending_socket_timeout_ms: 30000
  tcp_parked_socket_timeout_ms: 600000

  button_pin: GPIO35
  button_inverted: true
  button_strapping: false

  mode_pin: GPIO33
  mode_strapping: false

  zRST_pin: GPIO16
  zRST_strapping: false
  zRST_inverted: true

  zBSL_pin: GPIO32
  zBSL_strapping: false
  zBSL_inverted: true

  led_red_pin: GPIO12
  led_red_strapping: true
  led_red_inverted: false

  led_blue_pin: GPIO14
  led_blue_strapping: false
  led_blue_inverted: false

  uart_rx_pin: GPIO36
  uart_tx_pin: GPIO04
  uart_baud_rate: 115200

  lan_mdc_pin: GPIO23
  lan_mdc_strapping: false
  lan_mdio_pin: GPIO18
  lan_mdio_strapping: false
  lan_clk_pin: GPIO17
  lan_clk_strapping: false
  lan_clk_mode: CLK_OUT
  lan_power_pin: GPIO05
  lan_power_strapping: true

  zigbee_reset_timeout_ms: 5000

  znp_start_timeout_ms: 100 # wait for 0xFE
  znp_byte_timeout_ms: 10 # per-byte timeout
  znp_overall_timeout_ms: 500 # max time to match the expected SRSP
  znp_post_send_delay_ms: 10 # settle delay after SREQ
  znp_retries: 2

  bsl_ack_timeout_ms: 50 # wait for 0xCC after SYNC / before response
  bsl_header_timeout_ms: 50 # read [len][chk] header
  bsl_payload_timeout_ms: 50 # read payload bytes
  bsl_sync_gap_ms: 5 # gap between two SYNC bytes

  # === NVOCMP (Koenkk’s patched Z-Stack) layout hints ===
  # Adjust these if you use a different Z-Stack build.
  nv_base_cc26x2: 0x00050000 # CC26x2/CC13x2 (non-x7) NV start, size 0x6000
  nv_size_cc26x2: 0x00006000
  nv_base_cc26x2x7: 0x000A6000 # CC26x2x7/CC13x2x7 (e.g., CC2652P7) NV start, size 0x8000
  nv_size_cc26x2x7: 0x00008000

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: yepiq.Zigbee_Gateway
    version: '1.98b'

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: '10'

### External components
external_components:
  # Local while developing; the published configuration can track this
  # repository once the component extraction is committed.
  - source: components
    components: [zigbee_gateway]

api:
  # This Ethernet gateway must remain operational without an API client.
  reboot_timeout: 0s

logger:
  level: DEBUG

ota:
  platform: esphome

web_server:
  version: 3
  id: websrv

### ZIGBEE RADIO
#
# Detailed chip-family, CCFG/BSL, flash-layout, NVOCMP, NIB field-map, and
# protocol behavior documentation now lives beside the implementation in:
#   components/zigbee_gateway/{zigbee_gateway.cpp,protocol.h}
zigbee_gateway:
  id: zigbee_gateway_component
  uart_id: uart_bus
  ip_address: mcu_ip_address
  tcp_port: ${tcp_serial_port}
  pending_socket_timeout: ${tcp_pending_socket_timeout_ms}ms
  parked_socket_timeout: ${tcp_parked_socket_timeout_ms}ms

  socket_connected:
    name: Socket Status
    id: socket_status
    entity_category: diagnostic
  connection_count:
    name: Socket Connections
    id: socket_connections
    entity_category: diagnostic
  transport_state:
    name: Zigbee TCP State
  pending_socket:
    name: Zigbee TCP Pending Socket
  parked_socket:
    name: Zigbee TCP Parked Socket
  last_transport_event:
    name: Zigbee TCP Last Event
  rejected_connections:
    name: Zigbee TCP Rejected Connections
  pending_timeouts:
    name: Zigbee TCP Pending Timeouts
  maintenance_sessions:
    name: Zigbee TCP Maintenance Sessions
  recovery_resets:
    name: Zigbee TCP Recovery Resets

  reset_pin:
    number: ${zRST_pin}
    inverted: ${zRST_inverted}
    ignore_strapping_warning: ${zRST_strapping}
  bsl_pin:
    number: ${zBSL_pin}
    inverted: ${zBSL_inverted}
    ignore_strapping_warning: ${zBSL_strapping}

  reset_timeout: ${zigbee_reset_timeout_ms}ms
  znp_start_timeout: ${znp_start_timeout_ms}ms
  znp_byte_timeout: ${znp_byte_timeout_ms}ms
  znp_overall_timeout: ${znp_overall_timeout_ms}ms
  znp_post_send_delay: ${znp_post_send_delay_ms}ms
  znp_retries: ${znp_retries}
  bsl_ack_timeout: ${bsl_ack_timeout_ms}ms
  bsl_header_timeout: ${bsl_header_timeout_ms}ms
  bsl_payload_timeout: ${bsl_payload_timeout_ms}ms
  bsl_sync_gap: ${bsl_sync_gap_ms}ms

  # Koenkk Z-Stack NVOCMP layout hints; retain these as configuration because
  # other radio firmware builds can place NV differently.
  nv_base_cc26x2: ${nv_base_cc26x2}
  nv_size_cc26x2: ${nv_size_cc26x2}
  nv_base_cc26x2x7: ${nv_base_cc26x2x7}
  nv_size_cc26x2x7: ${nv_size_cc26x2x7}

  restart:
    name: Restart Zigbee
  enter_bsl:
    name: Zigbee BSL Mode
  router_rejoin:
    name: Zigbee Router Rejoin
  refresh_metadata:
    name: Refresh Zigbee Information

  flash_size:
    name: Zigbee Flash Size
  tx_power:
    name: Zigbee TX Power
  pan_id:
    name: Zigbee PAN ID
  channel:
    name: Zigbee Channel
  on_network:
    name: Zigbee Network Status
  firmware:
    name: Zigbee Firmware
  stack:
    name: Zigbee Stack
  self_ieee:
    name: Zigbee Self IEEE Address
  parent_ieee:
    name: Zigbee Parent IEEE Address
  role:
    name: Zigbee Role
  extended_pan_id:
    name: Zigbee Extended PAN ID
  hardware:
    name: Zigbee Hardware
  metadata_status:
    name: Zigbee Metadata Status

### CONTROL SETTINGS

select:
  ### Zigbee Serial Transport Selector
  - platform: template
    name: Zigbee Serial Transport
    id: select_mode
    icon: mdi:swap-horizontal
    options:
      - Zigbee TCP Serial
      - Zigbee USB Serial
    initial_option: Zigbee TCP Serial
    optimistic: true
    restore_value: true
    entity_category: config
    set_action:
      - if:
          condition:
            lambda: 'return x == "Zigbee USB Serial";'
          then:
            - switch.turn_on: switch_mode
          else:
            - switch.turn_off: switch_mode

button:
  ### ESP32 Restart
  - platform: restart
    name: Restart ESP32
    id: restart_esp32
    entity_category: config

binary_sensor:
  ### Status of physical button
  - platform: gpio
    name: Mode Button
    id: mode_button
    pin:
      number: ${button_pin}
      mode: INPUT
      inverted: ${button_inverted}
      ignore_strapping_warning: ${button_strapping}
    entity_category: diagnostic
    on_press:
      then:
        - select.next: select_mode

sensor:
  - platform: uptime
    id: uptime_s
    update_interval: 60s

switch:
  ### Serial Transport Switch: OFF for TCP, ON for USB
  - platform: gpio
    name: Switch Mode (internal)
    id: switch_mode
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      number: ${mode_pin}
      ignore_strapping_warning: ${mode_strapping}
    icon: mdi:toggle-switch
    on_turn_on:
      then:
        - switch.turn_on: led_red
    on_turn_off:
      then:
        - switch.turn_off: led_red

  ### RED LED - Mode Indicator
  - platform: gpio
    name: Mode LED (RED)
    id: led_red
    internal: true
    pin:
      number: ${led_red_pin}
      ignore_strapping_warning: ${led_red_strapping}
      inverted: ${led_red_inverted}
    restore_mode: ALWAYS_OFF

  ### BLUE LED - Power Indicator
  - platform: gpio
    name: Power LED (BLUE)
    id: led_blue
    internal: true
    pin:
      number: ${led_blue_pin}
      ignore_strapping_warning: ${led_blue_strapping}
      inverted: ${led_blue_inverted}
    restore_mode: ALWAYS_ON

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: IP Address
      id: mcu_ip_address
      entity_category: diagnostic
      icon: mdi:ip-network
    mac_address:
      name: MAC Address
      id: mcu_mac_address
      entity_category: diagnostic
      disabled_by_default: true
      icon: mdi:lan

### UART Settings
uart:
  id: uart_bus
  rx_pin: ${uart_rx_pin}
  tx_pin: ${uart_tx_pin}
  baud_rate: ${uart_baud_rate}
### Auto Discovery via mDNS
mdns:
  services:
    - service: '_uzg-01'
      protocol: '_tcp'
      port: ${tcp_serial_port}
      txt:
        version: 1.0
        name: UZG-01
        radio_type: znp
        baud_rate: ${uart_baud_rate}
        data_flow_control: software

### Ethernet Settings
ethernet:
  type: LAN8720
  mdc_pin:
    number: ${lan_mdc_pin}
    ignore_strapping_warning: ${lan_mdc_strapping}
  mdio_pin:
    number: ${lan_mdio_pin}
    ignore_strapping_warning: ${lan_mdio_strapping}
  clk:
    pin:
      number: ${lan_clk_pin}
      ignore_strapping_warning: ${lan_clk_strapping}
    mode: ${lan_clk_mode}
  phy_addr: 0
  power_pin:
    number: ${lan_power_pin}
    ignore_strapping_warning: ${lan_power_strapping}

### Home Assistant Time
time:
  - platform: homeassistant
    id: ha_time
